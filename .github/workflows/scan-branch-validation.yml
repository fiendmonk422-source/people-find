name: Scan branch validation

on:
  push:
    branches:
      - feature/doll-visual-scan-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      SUPABASE_SERVICE_ROLE_KEY: validation-placeholder
      SCAN_INDEX_SECRET: validation-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and synchronize lockfile in runner
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
