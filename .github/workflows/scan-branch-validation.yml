name: Scan branch validation

on:
  push:
    branches:
      - feature/doll-visual-scan-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      SUPABASE_SERVICE_ROLE_KEY: validation-placeholder
      SCAN_INDEX_SECRET: validation-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and synchronize lockfile
        run: npm install
      - name: Commit synchronized lockfile when dependencies changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync package lockfile for scan dependencies"
            git push
          fi
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
